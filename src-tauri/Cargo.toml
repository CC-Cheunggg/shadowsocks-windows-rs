[package]
name = "shadowsocks-windows-rs"
version = "0.1.0"
description = "A modern Windows Shadowsocks client"
authors = ["Shadowsocks Windows RS contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/CC-Cheunggg/shadowsocks-windows-rs"

[lib]
name = "shadowsocks_windows_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
