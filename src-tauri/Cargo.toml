[package]
name = "shadowsocks-windows-rs"
version = "0.1.0"
description = "A modern Windows Shadowsocks client"
authors = ["Shadowsocks Windows RS contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/CC-Cheunggg/shadowsocks-windows-rs"

[lib]
name = "shadowsocks_windows_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "std",
] }
tauri = { version = "2", features = [] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
